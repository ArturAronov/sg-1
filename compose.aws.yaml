# EC2 control plane only. Generated code runs exclusively in CodeBuild/Fargate.
name: sg1
x-backend: &backend
  image: ${SG1_API_IMAGE:?Set a digest-pinned API image}
  env_file: .env.production
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION:?Set AWS_REGION}
      awslogs-group: ${SG1_CONTROL_LOG_GROUP:?Set log group}
      awslogs-stream: backend
services:
  migrate:
    <<: *backend
    command: [migrate]
    env_file: [.env.production, .env.migrate]
    restart: "no"
    profiles: [maintenance]
  api:
    <<: *backend
    command: [serve]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 8s
      retries: 5
  gateway:
    <<: *backend
    command: [gateway]
    ports: ["8081:8081"]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://127.0.0.1:8081/__sg1_health"]
      interval: 15s
      timeout: 8s
      retries: 5
  worker:
    <<: *backend
    command: [worker]
    env_file: [.env.production, .env.worker]
    # No Docker socket, privileged mode, source checkout, or AWS static keys.
    depends_on:
      api: {condition: service_healthy}
      gateway: {condition: service_healthy}
  web:
    image: ${SG1_WEB_IMAGE:?Set a digest-pinned frontend image}
    env_file: .env.web
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777", "/app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["42069:42069"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:42069/signed-out').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Set AWS_REGION}
        awslogs-group: ${SG1_CONTROL_LOG_GROUP:?Set log group}
        awslogs-stream: web
