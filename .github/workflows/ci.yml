name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sg1
          POSTGRES_PASSWORD: sg1_ci_only
          POSTGRES_DB: sg1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sg1 -d sg1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sg-1/backend
    env:
      SG1_TEST_DATABASE_URL: postgres://sg1:sg1_ci_only@127.0.0.1:5432/sg1_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sg-1/backend/go.mod
          cache-dependency-path: sg-1/backend/go.sum
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/sg1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sg-1/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sg-1/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sg-1/frontend/package-lock.json
      - run: node scripts/setup.mjs
      - run: docker compose up --build -d --wait
      - run: npm ci
        working-directory: sg-1/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: sg-1/frontend
      - run: npm run test:e2e
        working-directory: sg-1/frontend
      - if: failure()
        run: docker compose logs api web migrate seed
      - if: always()
        run: docker compose down
